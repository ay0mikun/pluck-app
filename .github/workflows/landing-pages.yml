name: Deploy Pluck landing page

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pluck-pages
  cancel-in-progress: false

jobs:
  landing:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Build standalone landing page
        run: python3 scripts/build_landing.py _site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Publish landing page
        id: deployment
        uses: actions/deploy-pages@v4
