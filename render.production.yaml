# Create a separate Blueprint using this file and the main branch.
services:
  - type: web
    name: pluck-api
    runtime: python
    plan: free
    branch: main
    buildCommand: pip install -r requirements.txt
    startCommand: python server.py
    healthCheckPath: /api/health
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: LOCAL_EMAIL_PREVIEW
        value: "0"
      - key: SUPABASE_STORAGE_BUCKET
        value: pluck-media
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: APP_ORIGIN
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: X_OAUTH_CLIENT_ID
        sync: false
      - key: X_OAUTH_CLIENT_SECRET
        sync: false
